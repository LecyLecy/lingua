[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingua-local"
version = "0.1.0"
description = "Local real-time multilingual captions and stable-segment translation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = []

[project.optional-dependencies]
app = ["PySide6>=6.7", "sounddevice>=0.5", "numpy>=1.26"]
asr = ["faster-whisper>=1.1"]
training = ["torch>=2.4", "transformers>=4.45", "datasets>=3.0", "evaluate>=0.4"]
translation = ["ctranslate2>=4.4", "sentencepiece>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]
